<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>FinanzasAR</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/x-icon" href="favicon.ico">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- Tema PrimeNG intercambiable (lo cambia ThemeService) -->
  <link id="app-theme" rel="stylesheet" href="themes/lara-light-blue/theme.css">
  <script>
    // Aplica el tema guardado antes del primer render para evitar parpadeo.
    (function () {
      try {
        if (localStorage.getItem('finanzas-theme') === 'dark') {
          document.documentElement.classList.add('dark');
          document.getElementById('app-theme').href = 'themes/lara-dark-blue/theme.css';
        }
      } catch (e) {}
    })();
  </script>
</head>
<body>
  <app-root></app-root>
</body>
</html>
